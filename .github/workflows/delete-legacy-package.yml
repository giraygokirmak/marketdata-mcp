name: Delete legacy package
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Identify the token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('login:', d.get('login')); print('type :', d.get('type'))"

      - name: Delete ghcr.io/${{ github.repository_owner }}/marketdata-mcp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "user-scoped endpoint:"
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/marketdata-mcp" \
            -w '\nHTTP=%{http_code}\n' || true

      - name: Is it still there?
        run: |
          TK=$(curl -sS "https://ghcr.io/token?scope=repository%3A${{ github.repository_owner }}%2Fmarketdata-mcp%3Apull&service=ghcr.io" \
               | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          if [ -z "$TK" ]; then echo "GONE (anonymous pull token denied)"; exit 0; fi
          echo "STILL PRESENT:"; curl -sS -H "Authorization: Bearer $TK" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/marketdata-mcp/tags/list"
