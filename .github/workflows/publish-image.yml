# Build and publish a multi-arch Docker image of the MCP server to GHCR.
#
# Triggers:
#   • push to main   → :latest + :sha-<shortsha>
#   • push v* tag    → :<semver> + :latest
#   • pull_request   → build only, no push (sanity check)
#   • workflow_dispatch → manual trigger
#
# Architectures: linux/amd64 + linux/arm64 (covers x86 hosts + Hetzner CAX,
# Apple Silicon, Raspberry Pi, AWS Graviton).

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Never publish an image whose code fails the suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"   # matches the Dockerfile base image
          enable-cache: true
      # A venv, not --system: the Python that setup-uv provisions is
      # externally managed (PEP 668), so --system installs are refused.
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io/<owner>/<repo>

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Only log in when we actually intend to push (skip on pull_request).
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # smaller manifest, avoids attestation noise
